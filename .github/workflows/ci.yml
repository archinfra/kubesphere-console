name: Console CI

on:
  pull_request:
    branches:
      - master
      - release-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on Node 24 LTS
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build console
        run: yarn build
